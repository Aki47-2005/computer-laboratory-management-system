{% extends 'base.html' %}

{% block title %}Edit Lab — Computer Lab Management System{% endblock %}

{% block heading %}EDIT LAB{% endblock %}

{% block content %}
               <form method="post">
            {% csrf_token %}
            <div class="card">
                <div class="card-header"><div class="card-title">Edit Lab</div></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="name">Lab Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ lab.name }}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="location">Location</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ lab.location }}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="capacity">Capacity (number of computers)</label>
                            <input type="number" class="form-control" id="capacity" name="capacity" value="{{ lab.capacity }}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="duration">Session Duration (hours)</label>
                            <input type="number" class="form-control" id="duration" name="duration" value="{{ lab.duration }}" required>
                        </div>
                    </div>
                </div>
                <div class="card-action">
                    <button type="submit" class="btn btn-success">Update Lab</button>
                    <a href="{% url 'labs' %}" class="btn btn-danger">Cancel</a>
                </div>
            </div>
        </form>
{% endblock %}
